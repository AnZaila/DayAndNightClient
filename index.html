<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <link rel="preload" as="image" href="/hero/home.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>朝暮 · 你和我的日子</title>
    <meta name="description" content="朝暮，你和我的日子。">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dayandnight-theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          var locale = localStorage.getItem('dayandnight-locale')
          if (locale === 'en-US' || locale === 'zh-CN') {
            document.documentElement.setAttribute('lang', locale)
            if (locale === 'en-US') {
              document.title = 'Zhaomu · Our days'
              var desc = document.querySelector('meta[name="description"]')
              if (desc) desc.setAttribute('content', 'Zhaomu, the days that belong to us.')
            }
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
